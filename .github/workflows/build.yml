name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # build-assets.mjs has no dependencies, so there is nothing to install.
      - name: Build assets
        run: npm run production

      - name: Confirm the concatenated JS parses
        run: |
          set -e
          node --check public/theme/js/theme.js
          node --check public/admin/js/user.js
          echo "both bundles parse"

      - name: Confirm bundles were emitted
        run: |
          set -e
          for f in public/admin/css/user.css public/admin/js/user.js \
                   public/theme/css/theme.css public/theme/js/theme.js; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done

  php:
    name: php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Validate composer.json / composer.lock are in sync
        run: composer validate --strict --no-check-publish

      - name: Install from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies for known advisories
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$GITHUB_WORKSPACE/database/ci.sqlite|" .env
          touch database/ci.sqlite

      - name: Migrate
        run: php artisan migrate --force

      - name: Compile every Blade template
        run: php artisan view:cache

      - name: Tests
        run: php artisan test

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the runtime image actually builds: PHP 8.3 with gd, the Apache
      # document root pointed at public/, and composer install against the lock.
      - name: Build image
        run: docker build -t elitelima:ci .

      - name: Verify the extensions the app needs are present
        run: |
          set -e
          for ext in gd pdo_mysql mbstring fileinfo intl exif; do
            docker run --rm elitelima:ci php -m | grep -qx "$ext"               || { echo "::error::missing PHP extension: $ext"; exit 1; }
            echo "ok: $ext"
          done

      - name: Verify Apache serves from public/ and the app boots
        run: |
          set -e
          docker run --rm elitelima:ci sh -c 'php artisan --version'
          docker run --rm elitelima:ci sh -c 'test -f public/index.php'
          docker run --rm elitelima:ci sh -c 'test -f public/uploads/.htaccess'
          docker run --rm elitelima:ci sh -c 'grep -q "DocumentRoot /var/www/html/public" /etc/apache2/sites-available/000-default.conf'
