version: 2

updates:
  # ---- Front-end build toolchain (root package.json / package-lock.json) ----
  # Everything here is a devDependency: it runs at build time, never in the
  # shipped app. Grouped so ~143 alerts collapse into a couple of PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-build-toolchain:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned by the Vue 2 / Bootstrap 4 templates in resources/ and theme/.
      # Majors here break the build; upgrade deliberately, not via bot PR.
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "laravel-mix"
        update-types: ["version-update:semver-major"]

  # ---- PHP runtime dependencies (composer.json / composer.lock) ----
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "php"
    groups:
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Minor as well as patch. Laravel ships fixes in minor releases:
      # 12.69 -> 12.70 carried security hardening, and a patch-only group
      # never proposed it (Dependabot's PR for 12.69.3 closed itself as "no
      # longer updatable" once 12.70.x existed). None of the direct
      # dependencies are 0.x, so a minor here is an ordinary semver minor.
      composer-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors stay out of the bot's hands. A new Laravel major is a planned
      # upgrade with its own PR, and symfony/* majors are pinned by whichever
      # Laravel release is installed.
      - dependency-name: "laravel/framework"
        update-types: ["version-update:semver-major"]
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions (harmless to keep current once workflows exist) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    # Every action lives in the one workflow file, so ungrouped bumps arrive as
    # separate PRs that all edit build.yml and therefore conflict with each
    # other as soon as the first one merges. One PR per run instead.
    groups:
      github-actions:
        patterns:
          - "*"
