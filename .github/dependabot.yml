version: 2

updates:
  # ---- Front-end build toolchain (root package.json / package-lock.json) ----
  # Everything here is a devDependency: it runs at build time, never in the
  # shipped app. Grouped so ~143 alerts collapse into a couple of PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-build-toolchain:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned by the Vue 2 / Bootstrap 4 templates in resources/ and theme/.
      # Majors here break the build; upgrade deliberately, not via bot PR.
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "laravel-mix"
        update-types: ["version-update:semver-major"]

  # ---- PHP runtime dependencies (composer.json / composer.lock) ----
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "php"
    groups:
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
      composer-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # The app is on Laravel 6.x with php ^7.1.3. Major bumps proposed by the
      # bot cannot install and would only create noise; the framework upgrade
      # is a tracked project, not a dependency bump.
      - dependency-name: "laravel/framework"
        update-types: ["version-update:semver-major"]
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions (harmless to keep current once workflows exist) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
